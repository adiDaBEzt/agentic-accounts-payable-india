# AP staff paste emails and portal text into chat; keep credentials out of prompts, logs and replies.
spec_version: v1
kind: control
control:
  artifact_name: Secrets Detector
  name: copilot_secrets_detector
  display_name: AP Copilot · secrets detector
  description: Redacts API keys, tokens and private keys in AP Copilot inputs and outputs.
  hooks: [agent_pre_invoke, agent_post_invoke]
  priority: 10
  agent_names: [ap_copilot_agent]
  config:
    enabled: {aws_access_key_id: true, aws_secret_access_key: true, google_api_key: true, slack_token: true,
              private_key_block: true, jwt_like: true}
    redact: true
    block_on_detection: false
